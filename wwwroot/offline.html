<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión - CAMSTEP</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
        @font-face { font-family: Quicksand; font-weight: 700; src: url("/fonts/quicksand-latin-700-normal.woff2") format("woff2"); }
        @font-face { font-family: Inter; font-weight: 400; src: url("/fonts/inter-latin-400-normal.woff2") format("woff2"); }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9f1ec; color: #1f2a37; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        img { width: 120px; height: 120px; animation: b 5s ease-in-out infinite; }
        h1 { font-family: Quicksand, Inter, sans-serif; letter-spacing: .12em; margin: 12px 0 6px; }
        p { color: #4a5563; max-width: 380px; line-height: 1.5; }
        button { margin-top: 10px; padding: 12px 22px; border: 0; border-radius: 12px; background: #1f2a37; color: #fff; font: inherit; cursor: pointer; }
        @keyframes b { 50% { transform: translateY(-6px); } }
        @media (prefers-reduced-motion: reduce) { img { animation: none; } }
    </style>
</head>
<body>
    <main>
        <img src="/img/camstep-logo.svg" alt="" />
        <h1>CAMSTEP</h1>
        <p>Parece que no hay conexión. Tus datos están a salvo en el servidor: cuando vuelva el internet, sigues justo donde ibas.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
